<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空战沙盘 · WT</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="logo">⌁</span><div><h1>空战沙盘</h1></div></div><div class="segmented mode-switch" role="tablist"><button id="mode-setup" class="active">沙盘布置</button><button id="mode-replay">WT 回放</button></div><div class="header-info"><span class="dot"></span><span id="status">连接中</span></div><button id="save" class="quiet">保存</button></header>
<div class="toolbar"><div class="time-block"><small>模拟时间</small><strong id="clock">00:00.00</strong></div><button id="start" class="primary">▶ 开始</button><button id="pause">Ⅱ 暂停</button><button id="step">单步 1 s</button><button id="reset" class="quiet">↺ 重置</button><div class="speed-control"><label for="speed">倍率</label><select id="speed"></select><span id="actual">实际 0.0×</span></div><div id="score"><span class="blue">蓝队 1</span><span class="orange">橙队 1</span></div></div>
<div id="notice" role="status" aria-live="polite"></div>
<main>
<aside class="deployment">
<div id="replay-side" hidden><div class="panel-heading"><h2>WT 回放</h2><span id="replay-tag" class="tag">未加载</span></div><label>我的飞机<select id="me"></select></label><label class="check side-check"><input type="checkbox" id="show-ai">显示 AI 单位</label><button id="fork" class="wide primary">从此刻接管</button><p id="replay-help" class="help">选一个回放，暂停后可从当前时刻接管。</p><div id="replay-list" class="unit-list"></div></div>
<div id="fork-info" class="boundary" hidden></div>
<div id="setup-side">
<div class="panel-heading"><h2>战场布置</h2><span id="setup-tag" class="tag">布置中</span></div>
<div id="scene-controls"><label>预设场景<select id="preset"><option value="duel">1 对 1 · 60 km 接敌</option><option value="four">2 对 2 · 双机编队</option><option value="mixed">4 对 4 · 多机型混编</option></select></label>
<div class="two-fields"><label>随机种子<input id="seed" type="number" step="1" value="1"></label><label>时间上限 / s<input id="limit" type="number" min="1" value="900"></label></div></div>
<div class="team-heading blue"><h3>蓝队</h3><button id="add-blue" title="在地图点击放置蓝队飞机">＋ 部署</button></div><div id="blue-list" class="unit-list"></div>
<div class="team-heading orange"><h3>橙队</h3><button id="add-orange" title="在地图点击放置橙队飞机">＋ 部署</button></div><div id="orange-list" class="unit-list"></div>
<p id="deployment-help" class="help">点选飞机编辑，拖动改位置。</p>
</div>
<div id="outputs" class="outputs"></div>
</aside>
<section class="battlefield">
<div class="map-toolbar"><div class="segmented"><button id="view3d" class="active">3D 战场</button><button id="view2d">俯视布置</button></div><button id="fit" class="quiet">全场</button><label class="check"><input type="checkbox" id="follow">跟随所选</label><label class="check"><input type="checkbox" id="trails" checked>轨迹</label><label class="check terrain-pick">地形<select id="terrain" aria-label="地形等高线"></select></label><span id="scale-label"></span></div>
<div class="canvas-wrap"><canvas id="map" tabindex="0" aria-label="3D 战场"></canvas><div class="map-overlay"><div class="legend"><span class="blue">▲ 蓝队</span><span class="orange">▲ 橙队</span><span>● 导弹</span></div><div id="terrain-legend" hidden></div><div id="map-hint">拖动旋转 · Shift + 拖动平移 · 滚轮缩放</div></div><div id="control-banner" hidden></div><div id="terminal" hidden></div><div id="fork-panel" hidden><strong id="fork-title">从此刻接管</strong><p class="help">不接管的飞机按 WT 轨迹飞，在途导弹重新模拟。</p><div id="fork-rows"></div><label class="check side-check"><input type="checkbox" id="fork-ai">包含 AI（按 WT 轨迹）</label><div class="two-fields"><button id="fork-go" class="primary">开始推演</button><button id="fork-cancel">取消</button></div></div></div>
<div id="timeline" hidden><div class="tl-bar"><div id="tl-markers"></div><input id="tl-range" type="range" min="0" max="1" step="0.25" aria-label="回放时间轴"></div><span id="tl-label">—</span></div>
<div class="map-footer"><span id="coordinates"></span><span id="health"></span></div>
<div class="bottom-strip" hidden><span id="run-note"></span></div>
</section>
<aside class="inspector">
<section id="sec-selected" class="sec">
<div class="panel-heading"><h2>选中对象</h2><span id="unit-id" class="tag">—</span></div><div id="empty-selection" class="help">点击飞机选中；推演中 Ctrl / ⌘ 多选。</div>
<div id="unit-panel" hidden>
<div class="unit-overview"><div id="unit-name" class="unit-name"></div><div id="unit-state" class="unit-state"></div></div>
<div id="edit-panel"><label>机型<select id="aircraft"></select></label><label>导弹<select id="missile"></select></label><div class="two-fields"><label>导弹 / 枚<input id="ammo" type="number" min="0"></label><label>箔条 / 束<input id="chaff" type="number" min="0"></label></div><div class="two-fields"><label>东 / km<input id="east" type="number" step="0.1"></label><label>北 / km<input id="north" type="number" step="0.1"></label></div><div class="two-fields"><label>打法<select id="archetype"></select></label><label>技能<select id="skill"></select></label></div></div>
<div id="mode-panel" hidden><label>控制方式<select id="mode"><option value="auto">自主脚本</option><option value="manual">人工导航</option><option value="pilot">亲自驾驶</option></select></label><p id="mode-help" class="help"></p></div>
<p id="track-note" class="help" hidden></p><div id="nav-fields"><div class="two-fields"><label>高度 / m<input id="altitude" type="number" min="100" max="19500" step="100"></label><label>速度 / m/s<input id="velocity" type="number" min="50" step="10"></label></div><label>航向 / °<input id="heading" type="number" min="0" max="360" step="5"></label></div>
<button id="apply" class="wide primary">应用</button><button id="destination" class="wide" hidden>⌖ 指定目的地</button><button id="pilot" class="wide" hidden>键盘驾驶</button><button id="make-me" class="wide" hidden>★ 设为本机</button><button id="remove" class="wide danger">移除</button>
<div id="weapon-panel" hidden><select id="tracks" aria-label="雷达航迹"></select><div class="two-fields"><button id="fire">发射</button><button id="drop-chaff">投放箔条</button></div></div>
</div>
<div id="group-panel" hidden><div id="group-rows" class="unit-list"></div><p id="group-note" class="help"></p><label>控制方式<select id="g-mode"><option value="">不变</option><option value="auto">自主脚本</option><option value="manual">人工导航</option></select></label><div class="two-fields"><label>高度 / m<input id="g-altitude" type="number" min="100" max="19500" step="100"></label><label>速度 / m/s<input id="g-velocity" type="number" min="50" step="10"></label></div><label>航向 / °<input id="g-heading" type="number" min="0" max="360" step="5"></label><button id="g-apply" class="wide primary">下达</button><button id="g-destination" class="wide">⌖ 指定目的地（保持队形）</button><button id="g-clear" class="wide quiet">取消多选</button></div>
<div class="sub-heading">事件</div><div id="unit-events" class="events mini"></div>
</section>
<section id="sec-global" class="sec">
<div class="panel-heading"><h2>全局</h2><span id="global-count" class="tag">0 条</span></div><div id="global-events" class="events"></div>
</section>
<section id="sec-own" class="sec">
<div class="panel-heading"><h2>本机</h2><span id="own-tag" class="tag">未指定</span></div><div id="own-empty" class="help"></div>
<div id="own-panel" hidden><div id="own-state" class="unit-state"></div><p id="own-threat" class="own-threat" hidden></p><div id="own-weapons"><p id="own-note" class="help" hidden></p><select id="own-tracks" aria-label="本机雷达航迹"></select><div class="two-fields"><button id="own-fire">发射</button><button id="own-chaff">投放箔条</button></div><button id="own-pilot" class="wide" hidden>驾驶本机</button></div><div id="own-events" class="events"></div></div>
</section>
</aside>
</main>
<script src="/app.js"></script>
</body></html>
